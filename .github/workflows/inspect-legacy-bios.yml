name: Inspect ISO for Legacy BIOS

on:
  workflow_dispatch:
    inputs:
      iso_url:
        description: "Direct HTTPS URL of the ISO to inspect"
        required: true
        default: "https://archive.org/download/atom-os-tiny-11-25h2-003/AtomOS%20Tiny11%2025h2%20003%20with%20AnkhTech.iso"
        type: string
      iso_sha256:
        description: "Optional SHA-256 checksum of the ISO (recommended)"
        required: false
        default: ""
        type: string
      boot_timeout_seconds:
        description: "How long to wait after the first BIOS boot"
        required: true
        default: "75"
        type: string
      restart_wait_seconds:
        description: "How long to wait after the virtual machine reset"
        required: true
        default: "75"
        type: string
      ventoy_url:
        description: "Direct HTTPS URL of the Ventoy Linux release tarball"
        required: true
        default: "https://github.com/ventoy/Ventoy/releases/download/v1.1.17/ventoy-1.1.17-linux.tar.gz"
        type: string

permissions:
  contents: read

concurrency:
  group: inspect-legacy-bios
  cancel-in-progress: false

jobs:
  inspect:
    name: Inspect ISO El Torito and Legacy BIOS boot
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      ISO_URL: ${{ inputs.iso_url }}
      ISO_SHA256: ${{ inputs.iso_sha256 }}
      BOOT_TIMEOUT_SECONDS: ${{ inputs.boot_timeout_seconds }}
      RESTART_WAIT_SECONDS: ${{ inputs.restart_wait_seconds }}
      VENTOY_URL: ${{ inputs.ventoy_url }}
      GITHUB_PERSONAL_ACCESS_TOKEN: ${{ secrets.GITHUB_PERSONAL_ACCESS_TOKEN }}

    steps:
      # This workflow intentionally does not use actions/checkout or git clone.
      - name: Install inspection tools
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            qemu-system-x86 \
            seabios \
            socat \
            imagemagick \
            tesseract-ocr \
            exfatprogs \
            parted
          mkdir -p reports

      - name: Read reference repository metadata with curl
        shell: bash
        run: |
          set -Eeuo pipefail

          auth_args=()
          if [[ -n "${GITHUB_PERSONAL_ACCESS_TOKEN:-}" ]]; then
            auth_args=(-H "Authorization: Bearer ${GITHUB_PERSONAL_ACCESS_TOKEN}")
          fi

          if ! curl --fail --silent --show-error --location \
              --retry 4 --retry-all-errors \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "${auth_args[@]}" \
              "https://api.github.com/repos/bluecloud122/tiny11builder/commits/legacy" \
              --output reports/tiny11builder-reference.json; then
            # The repository is public, so an expired or unavailable optional
            # token must not prevent the ISO inspection itself from running.
            echo "Authenticated reference lookup failed; retrying public lookup."
            curl --fail --silent --show-error --location \
              --retry 4 --retry-all-errors \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/bluecloud122/tiny11builder/commits/legacy" \
              --output reports/tiny11builder-reference.json
          fi

          node <<'NODE'
          const fs = require("node:fs");

          const reference = JSON.parse(
            fs.readFileSync("reports/tiny11builder-reference.json", "utf8"),
          );
          const summary = {
            repository: reference.html_url
              ? "bluecloud122/tiny11builder"
              : "reference lookup failed",
            branch: "legacy",
            commit: reference.sha ?? null,
            commitUrl: reference.html_url ?? null,
            subject: reference.commit?.message?.split("\n", 1)[0] ?? null,
          };

          fs.writeFileSync(
            "reports/tiny11builder-reference-summary.json",
            JSON.stringify(summary, null, 2) + "\n",
          );
          console.log(`Reference branch: ${summary.branch}`);
          console.log(`Reference commit: ${summary.commit ?? "unknown"}`);
          console.log(`Reference subject: ${summary.subject ?? "unknown"}`);
          NODE

      - name: Download ISO with curl
        shell: bash
        run: |
          set -Eeuo pipefail

          if [[ "${ISO_URL}" != https://* ]]; then
            echo "Refusing to download a non-HTTPS ISO URL." >&2
            exit 1
          fi

          ISO_PATH="${RUNNER_TEMP}/input.iso"
          echo "Downloading ISO from ${ISO_URL%%\?*}"
          curl --fail --silent --show-error --location \
            --retry 5 --retry-all-errors \
            --connect-timeout 30 \
            --continue-at - \
            "${ISO_URL}" \
            --output "${ISO_PATH}"

          printf 'ISO_PATH=%s\n' "${ISO_PATH}" >> "${GITHUB_ENV}"
          printf 'ISO_URL=%s\n' "${ISO_URL}" >> reports/input.txt
          stat --printf='ISO_BYTES=%s\n' "${ISO_PATH}" | tee -a reports/input.txt
          sha256sum "${ISO_PATH}" | tee reports/downloaded-sha256.txt

      - name: Verify optional ISO checksum
        shell: bash
        run: |
          set -Eeuo pipefail

          expected="$(printf '%s' "${ISO_SHA256}" | tr -d '[:space:]' | tr '[:lower:]' '[:upper:]')"
          if [[ -z "${expected}" ]]; then
            echo "No ISO_SHA256 was supplied; continuing without checksum verification."
            echo "CHECKSUM=SKIPPED (no checksum supplied)" >> reports/input.txt
            exit 0
          fi

          if [[ ! "${expected}" =~ ^[A-F0-9]{64}$ ]]; then
            echo "iso_sha256 must contain exactly 64 hexadecimal characters." >&2
            exit 1
          fi

          actual="$(sha256sum "${ISO_PATH}" | awk '{print toupper($1)}')"
          if [[ "${actual}" != "${expected}" ]]; then
            echo "ISO SHA-256 mismatch." >&2
            echo "Expected: ${expected}" >&2
            echo "Actual:   ${actual}" >&2
            exit 1
          fi

          echo "CHECKSUM=PASS ${actual}" | tee -a reports/input.txt

      - name: Inspect ISO9660 and El Torito structures with Node.js
        shell: bash
        run: |
          set -Eeuo pipefail
          node <<'NODE'
          const fs = require("node:fs");

          const isoPath = process.env.ISO_PATH;
          const sectorSize = 2048;
          const fd = fs.openSync(isoPath, "r");
          const fileSize = fs.fstatSync(fd).size;

          function readAt(offset, length) {
            const buffer = Buffer.alloc(length);
            const bytesRead = fs.readSync(fd, buffer, 0, length, offset);
            if (bytesRead !== length) {
              throw new Error(
                `Could not read ${length} bytes at offset ${offset}; got ${bytesRead}`,
              );
            }
            return buffer;
          }

          function u16le(buffer, offset) {
            return buffer.readUInt16LE(offset);
          }

          function u32le(buffer, offset) {
            return buffer.readUInt32LE(offset);
          }

          function ascii(buffer, start, end) {
            return buffer.toString("ascii", start, end).replace(/\0+$/, "").trim();
          }

          function hex(buffer) {
            return buffer.toString("hex").match(/../g)?.join(" ") ?? "";
          }

          const checks = [];
          const warnings = [];
          const result = {
            isoPath,
            fileSize,
            sectorSize,
            checks,
            warnings,
            legacyBiosCapable: false,
          };

          function addCheck(id, passed, message, details = {}) {
            checks.push({ id, passed, message, details });
          }

          try {
            const pvd = readAt(16 * sectorSize, sectorSize);
            const pvdIsIso9660 =
              pvd[0] === 1 && ascii(pvd, 1, 6) === "CD001" && pvd[6] === 1;
            addCheck(
              "iso9660-primary-volume-descriptor",
              pvdIsIso9660,
              pvdIsIso9660
                ? "ISO9660 primary volume descriptor is valid."
                : "ISO9660 primary volume descriptor is missing or invalid.",
              {
                systemIdentifier: ascii(pvd, 8, 40),
                volumeIdentifier: ascii(pvd, 40, 72),
              },
            );

            const bootRecord = readAt(17 * sectorSize, sectorSize);
            const bootRecordIsElTorito =
              bootRecord[0] === 0 &&
              ascii(bootRecord, 1, 6) === "CD001" &&
              bootRecord[6] === 1 &&
              ascii(bootRecord, 7, 39).toUpperCase().includes("EL TORITO");
            const catalogLba = bootRecordIsElTorito
              ? u32le(bootRecord, 71)
              : null;

            addCheck(
              "el-torito-boot-record",
              bootRecordIsElTorito,
              bootRecordIsElTorito
                ? `El Torito boot record found; catalog LBA is ${catalogLba}.`
                : "El Torito boot record was not found.",
              {
                bootSystemIdentifier: ascii(bootRecord, 7, 39),
                catalogLba,
              },
            );

            let biosEntryPassed = false;
            if (bootRecordIsElTorito && catalogLba !== null) {
              const catalog = readAt(catalogLba * sectorSize, sectorSize);
              const validation = catalog.subarray(0, 32);
              let checksum = 0;
              for (let offset = 0; offset < 32; offset += 2) {
                checksum = (checksum + u16le(validation, offset)) & 0xffff;
              }

              const validationEntryPassed =
                validation[0] === 0x01 &&
                validation[30] === 0x55 &&
                validation[31] === 0xaa &&
                checksum === 0;
              const platformId = validation[1];
              const platformName =
                {
                  0: "80x86",
                  1: "PowerPC",
                  2: "Mac",
                  0xef: "EFI",
                }[platformId] ?? `0x${platformId.toString(16)}`;

              const defaultEntry = catalog.subarray(32, 64);
              const bootIndicator = defaultEntry[0];
              const mediaType = defaultEntry[1];
              const mediaName =
                {
                  0: "no emulation",
                  1: "1.2 MiB floppy",
                  2: "1.44 MiB floppy",
                  3: "2.88 MiB floppy",
                  4: "hard disk",
                }[mediaType] ?? `unknown (0x${mediaType.toString(16)})`;
              const bootLba = u32le(defaultEntry, 8);
              const sectorCount = u16le(defaultEntry, 6);
              biosEntryPassed =
                validationEntryPassed &&
                platformId === 0 &&
                bootIndicator === 0x88 &&
                bootLba > 0 &&
                bootLba * sectorSize < fileSize;

              addCheck(
                "el-torito-validation-entry",
                validationEntryPassed,
                validationEntryPassed
                  ? "El Torito validation entry has a valid signature and checksum."
                  : "El Torito validation entry is invalid.",
                {
                  platform: platformName,
                  checksum,
                  signature: hex(validation.subarray(30, 32)),
                },
              );
              addCheck(
                "el-torito-bios-entry",
                biosEntryPassed,
                biosEntryPassed
                  ? `A bootable 80x86 BIOS entry points to LBA ${bootLba}.`
                  : "No valid bootable 80x86 BIOS entry was found.",
                {
                  bootIndicator: `0x${bootIndicator.toString(16)}`,
                  mediaType: mediaName,
                  loadSegment: `0x${u16le(defaultEntry, 2).toString(16)}`,
                  systemType: `0x${defaultEntry[4].toString(16)}`,
                  sectorCount,
                  bootLba,
                },
              );
            } else {
              addCheck(
                "el-torito-bios-entry",
                false,
                "Cannot inspect the BIOS boot entry without an El Torito catalog.",
              );
            }

            const mbr = readAt(0, 512);
            const mbrSignature = mbr[510] === 0x55 && mbr[511] === 0xaa;
            const partitions = [];
            for (let index = 0; index < 4; index += 1) {
              const offset = 446 + index * 16;
              const type = mbr[offset + 4];
              const lbaStart = mbr.readUInt32LE(offset + 8);
              const sectors = mbr.readUInt32LE(offset + 12);
              if (type !== 0 || lbaStart !== 0 || sectors !== 0) {
                partitions.push({
                  index: index + 1,
                  bootable: mbr[offset] === 0x80,
                  type: `0x${type.toString(16).padStart(2, "0")}`,
                  lbaStart,
                  sectors,
                });
              }
            }
            addCheck(
              "hybrid-mbr",
              mbrSignature,
              mbrSignature
                ? "An MBR signature is present in the ISO system area."
                : "No MBR signature is present in the ISO system area.",
              { partitions },
            );
            if (!mbrSignature) {
              warnings.push(
                "An MBR is useful for hybrid USB media, but it is not required for El Torito CD/DVD boot.",
              );
            }

            result.legacyBiosCapable =
              pvdIsIso9660 && bootRecordIsElTorito && biosEntryPassed;
          } catch (error) {
            addCheck(
              "parser",
              false,
              `Node.js parser error: ${error.message}`,
            );
          } finally {
            fs.closeSync(fd);
          }

          result.recommendation = result.legacyBiosCapable
            ? "The ISO contains the structures required for Legacy BIOS El Torito boot. The QEMU SeaBIOS smoke test is the next confirmation."
            : "The ISO does not pass the deterministic Legacy BIOS structure checks.";

          fs.writeFileSync(
            "reports/iso-analysis.json",
            JSON.stringify(result, null, 2) + "\n",
          );

          const markdown = [
            "# Legacy BIOS ISO inspection",
            "",
            `- ISO size: ${fileSize} bytes`,
            `- Deterministic Legacy BIOS structure result: **${result.legacyBiosCapable ? "PASS" : "FAIL"}**`,
            "",
            "## Checks",
            ...checks.map(
              (check) =>
                `- ${check.passed ? "PASS" : "FAIL"} — ${check.message}`,
            ),
            "",
            "## Warnings",
            ...(warnings.length > 0
              ? warnings.map((warning) => `- ${warning}`)
              : ["- None"]),
            "",
            "## Interpretation",
            "",
            result.recommendation,
            "",
            "A passing El Torito check does not guarantee that the image will install or run on a particular laptop. CPU mode, RAM, storage controller, graphics, network, and Windows driver compatibility still need to be tested on the target hardware.",
            "",
          ].join("\n");
          fs.writeFileSync("reports/iso-analysis.md", markdown);

          console.log(markdown);
          if (!result.legacyBiosCapable) process.exitCode = 1;
          NODE

      - name: Boot, capture images, reset, and boot again on old CPU profiles
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail

          if [[ -z "${ISO_PATH:-}" || ! -f "${ISO_PATH}" ]]; then
            echo "ISO was not downloaded; skipping QEMU." | tee reports/qemu-summary.txt
            exit 0
          fi

          bios="$(find /usr/share/seabios /usr/share/qemu -type f -name 'bios.bin' -print -quit 2>/dev/null || true)"
          if [[ -z "${bios}" ]]; then
            echo "SeaBIOS firmware was not found." | tee reports/qemu-summary.txt
            exit 1
          fi

          boot_seconds="${BOOT_TIMEOUT_SECONDS:-75}"
          restart_seconds="${RESTART_WAIT_SECONDS:-75}"
          if ! [[ "${boot_seconds}" =~ ^[0-9]+$ ]] || (( boot_seconds < 15 || boot_seconds > 300 )); then
            echo "boot_timeout_seconds must be between 15 and 300." >&2
            exit 1
          fi
          if ! [[ "${restart_seconds}" =~ ^[0-9]+$ ]] || (( restart_seconds < 15 || restart_seconds > 300 )); then
            echo "restart_wait_seconds must be between 15 and 300." >&2
            exit 1
          fi

          mkdir -p reports/cpu-profiles
          : > reports/cpu-results.tsv
          overall_status=0

          # Broadwell is the QEMU profile closest to a 5th-generation Intel
          # Core i5. The additional profiles check progressively older x64 CPUs.
          cpu_profiles=(
            "Broadwell|5th-generation Intel Core i5-class"
            "Haswell|4th-generation Intel Core i5-class"
            "IvyBridge|3rd-generation Intel Core i5-class"
            "SandyBridge|2nd-generation Intel Core i5-class"
          )

          capture_screen() {
            local monitor="$1"
            local prefix="$2"
            local ppm="${prefix}.ppm"
            local png="${prefix}.png"
            local ocr_base="${prefix}"
            local ocr="${prefix}.txt"

            rm -f "${ppm}" "${png}" "${ocr}"
            if ! timeout 15s bash -c "printf 'screendump %s\n' \"${ppm}\" | socat - \"UNIX-CONNECT:${monitor}\"" >/dev/null 2>&1; then
              return 1
            fi
            [[ -s "${ppm}" ]] || return 1
            convert "${ppm}" "${png}"
            rm -f "${ppm}"
            tesseract "${png}" "${ocr_base}" 2>/dev/null || true
            [[ -s "${png}" ]]
          }

          has_boot_failure() {
            local ocr="$1"
            grep -Eiq \
              'no bootable|boot failed|operating system not found|invalid system disk|non-system disk|not a bootable disk' \
              "${ocr}"
          }

          has_os_evidence() {
            local ocr="$1"
            grep -Eiq 'loading|windows|setup|project atom|ankh tech|ankhtech' "${ocr}"
          }

          for profile in "${cpu_profiles[@]}"; do
            cpu="${profile%%|*}"
            description="${profile#*|}"
            safe_cpu="$(printf '%s' "${cpu}" | tr '[:upper:]' '[:lower:]')"
            prefix="reports/cpu-profiles/${safe_cpu}"
            monitor="${RUNNER_TEMP}/qemu-${safe_cpu}.sock"
            qemu_log="${prefix}.qemu-console.log"
            serial_log="${prefix}.qemu-serial.log"
            boot_ocr="${prefix}-boot.txt"
            restart_ocr="${prefix}-restart.txt"
            qemu_pid=''
            boot_ok=0
            restart_ok=0
            boot_evidence=0
            restart_evidence=0

            rm -f "${monitor}"
            echo "=== Testing ${cpu}: ${description} ==="
            qemu-system-x86_64 \
              -name "legacy-bios-${safe_cpu}" \
              -machine pc \
              -bios "${bios}" \
              -cpu "${cpu}" \
              -m 2048 \
              -smp 2 \
              -cdrom "${ISO_PATH}" \
              -boot order=d,menu=off,strict=on \
              -display none \
              -monitor "unix:${monitor},server,nowait" \
              -serial "file:${serial_log}" \
              -no-reboot \
              > "${qemu_log}" 2>&1 &
            qemu_pid=$!

            monitor_ready=false
            for _ in $(seq 1 30); do
              if [[ -S "${monitor}" ]]; then
                monitor_ready=true
                break
              fi
              if ! kill -0 "${qemu_pid}" 2>/dev/null; then
                break
              fi
              sleep 1
            done

            if [[ "${monitor_ready}" == true ]]; then
              sleep "${boot_seconds}"
              if kill -0 "${qemu_pid}" 2>/dev/null &&
                capture_screen "${monitor}" "${prefix}-boot"; then
                boot_ok=1
                [[ -s "${boot_ocr}" ]] && has_boot_failure "${boot_ocr}" && boot_ok=0
                [[ -s "${boot_ocr}" ]] && has_os_evidence "${boot_ocr}" && boot_evidence=1
              fi

              if kill -0 "${qemu_pid}" 2>/dev/null; then
                timeout 10s bash -c "printf 'system_reset\n' | socat - \"UNIX-CONNECT:${monitor}\"" >/dev/null 2>&1 || true
                sleep "${restart_seconds}"
                if kill -0 "${qemu_pid}" 2>/dev/null &&
                  capture_screen "${monitor}" "${prefix}-restart"; then
                  restart_ok=1
                  [[ -s "${restart_ocr}" ]] && has_boot_failure "${restart_ocr}" && restart_ok=0
                  [[ -s "${restart_ocr}" ]] && has_os_evidence "${restart_ocr}" && restart_evidence=1
                fi
              fi
            fi

            if [[ -n "${qemu_pid}" ]] && kill -0 "${qemu_pid}" 2>/dev/null; then
              timeout 10s bash -c "printf 'quit\n' | socat - \"UNIX-CONNECT:${monitor}\"" >/dev/null 2>&1 || true
              kill "${qemu_pid}" 2>/dev/null || true
              wait "${qemu_pid}" 2>/dev/null || true
            fi

            printf '%s\t%s\t%s\t%s\t%s\t%s\n' \
              "${cpu}" "${description}" "${boot_ok}" "${restart_ok}" \
              "${boot_evidence}" "${restart_evidence}" \
              >> reports/cpu-results.tsv

            if (( boot_ok == 0 || restart_ok == 0 )); then
              overall_status=1
            fi
          done

          node <<'NODE'
          const fs = require("node:fs");
          const rows = fs
            .readFileSync("reports/cpu-results.tsv", "utf8")
            .trim()
            .split("\n")
            .filter(Boolean)
            .map((line) => {
              const [cpu, description, boot, restart, bootEvidence, restartEvidence] =
                line.split("\t");
              return {
                cpu,
                description,
                bootPassed: boot === "1",
                restartPassed: restart === "1",
                bootScreenEvidence: bootEvidence === "1",
                restartScreenEvidence: restartEvidence === "1",
              };
            });
          const result = {
            test: "Legacy BIOS ISO boot and reset on old Intel CPU profiles",
            note: "The reset test restarts the ISO boot chain. It does not install Windows to a virtual disk or prove an installed Windows desktop restart.",
            processors: rows,
            allBootsPassed: rows.every((row) => row.bootPassed),
            allRestartsPassed: rows.every((row) => row.restartPassed),
          };
          fs.writeFileSync(
            "reports/cpu-results.json",
            JSON.stringify(result, null, 2) + "\n",
          );
          fs.writeFileSync(
            "reports/cpu-results.md",
            [
              "# Old CPU Legacy BIOS boot and reset test",
              "",
              result.note,
              "",
              "| CPU profile | First boot | After reset | First-screen OS text | Restart-screen OS text |",
              "| --- | --- | --- | --- | --- |",
              ...rows.map(
                (row) =>
                  `| ${row.cpu} — ${row.description} | ${row.bootPassed ? "PASS" : "FAIL"} | ${row.restartPassed ? "PASS" : "FAIL"} | ${row.bootScreenEvidence ? "yes" : "no"} | ${row.restartScreenEvidence ? "yes" : "no"} |`,
              ),
              "",
              `All first boots: **${result.allBootsPassed ? "PASS" : "FAIL"}**`,
              `All reset boots: **${result.allRestartsPassed ? "PASS" : "FAIL"}**`,
              "",
            ].join("\n"),
          );
          console.log(JSON.stringify(result, null, 2));
          NODE

          cat reports/cpu-results.md | tee reports/qemu-summary.txt
          exit "${overall_status}"

      - name: Boot the ISO through Ventoy and repeat after reset
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail

          if [[ -z "${ISO_PATH:-}" || ! -f "${ISO_PATH}" ]]; then
            echo "ISO was not downloaded; skipping Ventoy." | tee reports/ventoy-summary.txt
            exit 0
          fi
          if [[ "${VENTOY_URL}" != https://* ]]; then
            echo "Refusing to download a non-HTTPS Ventoy URL." >&2
            exit 1
          fi

          boot_seconds="${BOOT_TIMEOUT_SECONDS:-75}"
          restart_seconds="${RESTART_WAIT_SECONDS:-75}"
          ventoy_archive="${RUNNER_TEMP}/ventoy.tar.gz"
          ventoy_root="${RUNNER_TEMP}/ventoy"
          ventoy_disk="${RUNNER_TEMP}/ventoy-test-disk.img"
          ventoy_mount="${RUNNER_TEMP}/ventoy-mount"
          ventoy_monitor="${RUNNER_TEMP}/ventoy-monitor.sock"
          ventoy_log="${GITHUB_WORKSPACE}/reports/ventoy.qemu-console.log"
          ventoy_serial="${GITHUB_WORKSPACE}/reports/ventoy.qemu-serial.log"
          ventoy_prefix="${GITHUB_WORKSPACE}/reports/ventoy"
          loopdev=''
          ventoy_pid=''
          mkdir -p "${ventoy_mount}"

          cleanup() {
            if [[ -n "${ventoy_pid}" ]] && kill -0 "${ventoy_pid}" 2>/dev/null; then
              timeout 10s bash -c "printf 'quit\n' | socat - \"UNIX-CONNECT:${ventoy_monitor}\"" >/dev/null 2>&1 || true
              kill "${ventoy_pid}" 2>/dev/null || true
              wait "${ventoy_pid}" 2>/dev/null || true
            fi
            if mountpoint -q "${ventoy_mount}"; then
              sudo umount "${ventoy_mount}" || true
            fi
            if [[ -n "${loopdev}" ]]; then
              sudo losetup -d "${loopdev}" 2>/dev/null || true
            fi
          }
          trap cleanup EXIT

          curl --fail --silent --show-error --location \
            --retry 5 --retry-all-errors \
            --connect-timeout 30 \
            "${VENTOY_URL}" \
            --output "${ventoy_archive}"
          rm -rf "${ventoy_root}"
          mkdir -p "${ventoy_root}"
          tar -xzf "${ventoy_archive}" --strip-components=1 -C "${ventoy_root}"

          ventoy_script="$(find "${ventoy_root}" -maxdepth 3 -type f -name 'Ventoy2Disk.sh' -print -quit)"
          if [[ -z "${ventoy_script}" ]]; then
            echo "Ventoy2Disk.sh was not found in the downloaded release." >&2
            exit 1
          fi

          # This is a disposable virtual disk, never a physical runner disk.
          truncate -s 8G "${ventoy_disk}"
          loopdev="$(sudo losetup --find --show --partscan "${ventoy_disk}")"
          sudo sh "${ventoy_script}" -I "${loopdev}"
          sudo partprobe "${loopdev}" || true
          sleep 3

          mapfile -t partitions < <(lsblk -lnpo NAME "${loopdev}")
          if (( ${#partitions[@]} < 3 )); then
            echo "Ventoy did not create the expected data partition." >&2
            lsblk -f "${loopdev}" >&2 || true
            exit 1
          fi
          data_partition="${partitions[2]}"
          sudo mount "${data_partition}" "${ventoy_mount}"
          sudo cp "${ISO_PATH}" "${ventoy_mount}/AtomOS-Tiny11-25H2-003.iso"
          sudo sync
          sudo umount "${ventoy_mount}"

          bios="$(find /usr/share/seabios /usr/share/qemu -type f -name 'bios.bin' -print -quit 2>/dev/null || true)"
          [[ -n "${bios}" ]] || {
            echo "SeaBIOS firmware was not found." >&2
            exit 1
          }

          rm -f "${ventoy_monitor}"
          qemu-system-x86_64 \
            -name ventoy-broadwell-legacy-bios \
            -machine pc \
            -bios "${bios}" \
            -cpu Broadwell \
            -m 2048 \
            -smp 2 \
            -drive "file=${ventoy_disk},format=raw,if=ide" \
            -boot order=c,menu=off,strict=on \
            -display none \
            -monitor "unix:${ventoy_monitor},server,nowait" \
            -serial "file:${ventoy_serial}" \
            -no-reboot \
            > "${ventoy_log}" 2>&1 &
          ventoy_pid=$!

          monitor_ready=false
          for _ in $(seq 1 30); do
            if [[ -S "${ventoy_monitor}" ]]; then
              monitor_ready=true
              break
            fi
            if ! kill -0 "${ventoy_pid}" 2>/dev/null; then
              break
            fi
            sleep 1
          done
          [[ "${monitor_ready}" == true ]] || {
            echo "Ventoy QEMU monitor did not become ready." | tee reports/ventoy-summary.txt
            exit 1
          }

          capture_ventoy_screen() {
            local name="$1"
            local ppm="${ventoy_prefix}-${name}.ppm"
            local png="${ventoy_prefix}-${name}.png"
            local ocr="${ventoy_prefix}-${name}.txt"
            rm -f "${ppm}" "${png}" "${ocr}"
            timeout 15s bash -c "printf 'screendump %s\n' \"${ppm}\" | socat - \"UNIX-CONNECT:${ventoy_monitor}\"" >/dev/null 2>&1
            [[ -s "${ppm}" ]] || return 1
            convert "${ppm}" "${png}"
            rm -f "${ppm}"
            tesseract "${png}" "${ocr%.txt}" 2>/dev/null || true
            [[ -s "${png}" ]]
          }

          has_boot_failure() {
            grep -Eiq \
              'no bootable|boot failed|operating system not found|invalid system disk|non-system disk|not a bootable disk' \
              "$1"
          }

          ventoy_menu_ok=0
          first_boot_ok=0
          restart_boot_ok=0

          sleep 15
          if capture_ventoy_screen "menu"; then
            if grep -Eiq 'ventoy|atomos|tiny11|atom' "${ventoy_prefix}-menu.txt"; then
              ventoy_menu_ok=1
            fi
            has_boot_failure "${ventoy_prefix}-menu.txt" && ventoy_menu_ok=0
          fi

          timeout 10s bash -c "printf 'sendkey ret\n' | socat - \"UNIX-CONNECT:${ventoy_monitor}\"" >/dev/null 2>&1 || true
          sleep "${boot_seconds}"
          if kill -0 "${ventoy_pid}" 2>/dev/null && capture_ventoy_screen "boot"; then
            first_boot_ok=1
            has_boot_failure "${ventoy_prefix}-boot.txt" && first_boot_ok=0
          fi

          if kill -0 "${ventoy_pid}" 2>/dev/null; then
            timeout 10s bash -c "printf 'system_reset\n' | socat - \"UNIX-CONNECT:${ventoy_monitor}\"" >/dev/null 2>&1 || true
            sleep 15
            capture_ventoy_screen "restart-menu" || true
            timeout 10s bash -c "printf 'sendkey ret\n' | socat - \"UNIX-CONNECT:${ventoy_monitor}\"" >/dev/null 2>&1 || true
            sleep "${restart_seconds}"
            if kill -0 "${ventoy_pid}" 2>/dev/null && capture_ventoy_screen "restart-boot"; then
              restart_boot_ok=1
              has_boot_failure "${ventoy_prefix}-restart-boot.txt" && restart_boot_ok=0
            fi
          fi

          node <<'NODE'
          const fs = require("node:fs");
          const result = {
            test: "Ventoy Legacy BIOS boot and reset",
            cpuProfile: "Broadwell (5th-generation Intel Core i5-class)",
            ventoyUrl: process.env.VENTOY_URL,
            menuPassed: fs.existsSync("reports/ventoy-menu.png"),
            firstBootPassed: fs.existsSync("reports/ventoy-boot.png"),
            resetMenuCaptured: fs.existsSync("reports/ventoy-restart-menu.png"),
            resetBootPassed: fs.existsSync("reports/ventoy-restart-boot.png"),
            note: "The test boots the ISO through Ventoy, resets the virtual machine, then boots the ISO through Ventoy again. It does not install Windows to a virtual disk.",
          };
          fs.writeFileSync("reports/ventoy-results.json", JSON.stringify(result, null, 2) + "\n");
          console.log(JSON.stringify(result, null, 2));
          NODE

          {
            echo "# Ventoy Legacy BIOS test"
            echo
            echo "- Ventoy release: ${VENTOY_URL}"
            echo "- CPU profile: Broadwell (5th-generation Intel Core i5-class)"
            echo "- Ventoy menu captured: ${ventoy_menu_ok}"
            echo "- First ISO boot passed: ${first_boot_ok}"
            echo "- Restart ISO boot passed: ${restart_boot_ok}"
            echo
            echo "PNG screenshots are included for the Ventoy menu, first boot, restart menu, and restart boot."
            echo "This validates the Ventoy/BIOS boot chain, not a full installed-Windows restart."
          } | tee reports/ventoy-summary.txt

          if (( ventoy_menu_ok == 0 || first_boot_ok == 0 || restart_boot_ok == 0 )); then
            exit 1
          fi

      - name: Upload inspection reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: legacy-bios-iso-inspection
          path: reports
          if-no-files-found: warn
          retention-days: 14